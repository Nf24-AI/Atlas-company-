<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b25">
  <meta name="description" content="ATLAS Company OS — شركة افتراضية ثلاثية الأبعاد يديرها رئيس تنفيذي بشري مع موظفين بالذكاء الاصطناعي">
  <title>ATLAS — Company OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="world" aria-label="مقر الشركة ثلاثي الأبعاد"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>
    <div id="loading" class="loading" role="status"><div class="brand-symbol">A<span>·</span></div><p>جارٍ تحميل المقر…</p></div>

    <header class="topbar frosted">
      <div class="brand"><div class="brand-symbol">A<span>·</span></div><div><b>ATLAS</b><small>COMPANY OS</small></div></div>
      <div class="top-links"><span class="live-dot"></span><span id="companyName">مقر الشركة</span><span class="separator">|</span><span id="modeBadge" class="mode-pill">…</span><span id="haltBadge" class="mode-pill danger" hidden>STOPPED</span></div>
      <div class="top-actions">
        <button id="langBtn" class="btn ghost small" type="button" aria-label="Language">EN</button>
        <button id="camModeBtn" class="btn ghost small" type="button" aria-pressed="false" title="V"><span id="camModeIcon" aria-hidden="true">◱</span> <span class="btn-label" id="camModeLabel" data-i18n="overview">عرض علوي</span></button>
        <button id="tpBtn" class="btn ghost small" type="button" aria-pressed="false" title="F"><span aria-hidden="true">🖱</span> <span class="btn-label" data-i18n="third">تحكم بالماوس</span></button>
        <button id="orbitBtn" class="btn ghost small" type="button" aria-pressed="false" title="C"><span id="orbitIcon">⟲</span> <span class="btn-label" data-i18n="orbit">كاميرا حرة</span></button>
        <button id="viewBtn" class="btn ghost small" type="button" title="R">↻ <span class="btn-label" data-i18n="recenter">إعادة التمركز</span></button>
        <button id="logoutBtn" class="btn ghost small" type="button" aria-label="تسجيل الخروج">⎋</button>
      </div>
    </header>

    <button id="teamToggle" class="hud-toggle team-toggle frosted" type="button" aria-controls="teamPanel" aria-expanded="false" title="T"><span class="hud-dots" aria-hidden="true"></span><span data-i18n="team">الفريق</span><span class="hud-alert" hidden></span><span class="key" aria-hidden="true">T</span></button>
    <button id="mapToggle" class="hud-toggle map-toggle frosted" type="button" aria-controls="mapPanel" aria-expanded="false" title="M"><span aria-hidden="true">▦</span><span data-i18n="map">الخريطة</span><span class="key" aria-hidden="true">M</span></button>
    <div id="roomBanner" class="room-banner" aria-live="polite"></div>
    <div id="tpHint" class="tp-hint frosted" hidden><p id="tpHintText"></p><label><span data-i18n="sensitivity">الحساسية</span> <input id="tpSens" type="range" min="0.2" max="3" step="0.1"></label><label><input id="tpInvert" type="checkbox"> <span data-i18n="invertY">عكس المحور الرأسي</span></label></div>

    <aside id="teamPanel" class="sidebar frosted" aria-label="الموظفون">
      <div class="eyebrow">YOUR COMPANY</div>
      <h1 id="sideTitle">فريق الشركة</h1>
      <div id="staffList"></div>
      <div class="sidebar-footer"><p id="modeHelp"></p></div>
    </aside>

    <div id="mapPanel" class="mini-map frosted"><div class="map-title">FLOOR MAP <span>01</span></div><canvas id="minimap" width="200" height="150" aria-label="خريطة الطابق — انقر على غرفة للانتقال"></canvas></div>

    <div class="hud-bottom frosted"><div class="control-help"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span data-i18n="move">للحركة</span><span class="dot-divider">·</span><span class="key">E</span><span data-i18n="interact">للتفاعل</span><span class="dot-divider">·</span><span class="key">V</span><span data-i18n="viewKey">العرض</span><span class="dot-divider">·</span><span class="key">R</span><span data-i18n="recenterKey">تمركز</span><span class="dot-divider">·</span><span class="key">F</span><span data-i18n="tpKey">الماوس</span></div><div class="target-status"><span id="roomChip" class="room-chip"></span><span id="nearbyText"></span><button id="interactBtn" class="btn primary" type="button" disabled></button></div></div>

    <div class="mobile-controls" aria-label="التحكم بالحركة"><button type="button" data-move="w" aria-label="أمام">▲</button><div><button type="button" data-move="a" aria-label="يسار">◀</button><button type="button" data-move="s" aria-label="خلف">▼</button><button type="button" data-move="d" aria-label="يمين">▶</button></div></div>
    <button id="mobileInteract" class="mobile-interact" type="button" hidden>E</button>

    <div id="overlay" class="overlay" hidden>
      <section class="work-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
        <div class="panel-head"><div class="eyebrow" id="panelKicker"></div><h2 id="panelTitle"></h2><p id="panelSubtitle"></p><button id="closePanel" class="close" type="button" aria-label="إغلاق">×</button></div>
        <div id="panelBody" class="office-body"></div>
      </section>
    </div>
    <div id="authRoot" class="overlay auth" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
